<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TravelSphere — discover, compare and plan memorable journeys." />
  <link rel="stylesheet" href="assets/css/main.css?v=professional-1" />
  <title>TravelSphere | Login</title>
</head>

<body class="login">

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TravelSphere home">
      <span class="brand-mark">✦</span>
      <span class="brand-text">TRAVELSPHERE</span>
    </a>


  </header>
  <main class="page-shell">
    <section class="auth-card">
      <div class="page-panel">
        <div class="auth-mark">✦</div>
        <div class="page-head">
          <p class="eyebrow">TravelSphere account</p>
          <h1 class="page-title">Welcome back</h1>
          <p class="page-subtitle">Sign in to continue to your saved places and trip planning tools.</p>
        </div>
        <form id="login-form">
          <fieldset class="fieldset">
            <legend>Sign in</legend>
            <div class="stack">
              <div class="form-field"><label for="username">Username</label><input id="username" name="username"
                  autocomplete="username" required type="text" placeholder="Your username" /></div>
              <div class="form-field"><label for="password">Password</label><input id="password" name="password"
                  autocomplete="current-password" required type="password" placeholder="Your password" /></div>
              <button class="btn full" type="submit">Login</button>
            </div>
          </fieldset>
        </form>
        <p class="auth-note">Demo sign-in is saved in this browser only. Please don’t use a real password.</p>
        <p class="center mt-md">New here? <a href="signup.html">Create an account →</a></p>
      </div>
    </section>
  </main>
  
    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
</body>

</html>
